name: GitHub Event Mail Report

on:
  push:

jobs:
  event-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate and Send Email Report
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}

          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_TIMESTAMP: ${{ github.event.head_commit.timestamp }}

        run: |
          python3 <<'PY'
          import os
          import html
          import smtplib
          import subprocess
          from email.mime.multipart import MIMEMultipart
          from email.mime.text import MIMEText

          # GitHub information
          repository = os.environ["REPOSITORY"]
          branch = os.environ["BRANCH"]
          actor = os.environ["ACTOR"]
          sha = os.environ["SHA"]
          before = os.environ["BEFORE"]
          event_name = os.environ["EVENT_NAME"]
          commit_message = os.environ["COMMIT_MESSAGE"]
          timestamp = os.environ["COMMIT_TIMESTAMP"]

          # Get changed files
          if before == "0000000000000000000000000000000000000000":
              command = [
                  "git",
                  "diff-tree",
                  "--no-commit-id",
                  "--name-status",
                  "-r",
                  sha
              ]
          else:
              command = [
                  "git",
                  "diff",
                  "--name-status",
                  before,
                  sha
              ]

          result = subprocess.run(
              command,
              capture_output=True,
              text=True,
              check=True
          )

          changed_files = result.stdout.strip().splitlines()

          # Build changed files HTML
          if changed_files:
              rows = ""

              for line in changed_files:
                  parts = line.split("\t", 1)

                  status = parts[0]
                  filename = parts[1] if len(parts) > 1 else ""

                  status_name = {
                      "A": "Added",
                      "M": "Modified",
                      "D": "Deleted",
                      "R": "Renamed",
                      "C": "Copied"
                  }.get(status, status)

                  rows += f"""
                  <tr>
                      <td>{html.escape(status_name)}</td>
                      <td>{html.escape(filename)}</td>
                  </tr>
                  """

              changed_files_html = f"""
              <table border="1" cellpadding="8" cellspacing="0"
                     style="border-collapse: collapse; width: 100%;">
                  <tr>
                      <th>Status</th>
                      <th>File</th>
                  </tr>
                  {rows}
              </table>
              """
          else:
              changed_files_html = "<p>No changed files detected.</p>"

          commit_url = f"https://github.com/{repository}/commit/{sha}"

          # Email subject
          subject = f"GitHub Event Report - {repository} - {branch}"

          # HTML email
          email_body = f"""
          <html>
          <body style="font-family: Arial, sans-serif;">

              <h2>GitHub Event Report</h2>

              <table cellpadding="8">
                  <tr>
                      <td><b>Repository</b></td>
                      <td>{html.escape(repository)}</td>
                  </tr>

                  <tr>
                      <td><b>Branch</b></td>
                      <td>{html.escape(branch)}</td>
                  </tr>

                  <tr>
                      <td><b>Changed By</b></td>
                      <td>{html.escape(actor)}</td>
                  </tr>

                  <tr>
                      <td><b>Event</b></td>
                      <td>{html.escape(event_name)}</td>
                  </tr>

                  <tr>
                      <td><b>Commit</b></td>
                      <td>
                          <a href="{commit_url}">
                              {html.escape(sha)}
                          </a>
                      </td>
                  </tr>

                  <tr>
                      <td><b>Commit Message</b></td>
                      <td>{html.escape(commit_message)}</td>
                  </tr>

                  <tr>
                      <td><b>Timestamp</b></td>
                      <td>{html.escape(timestamp)}</td>
                  </tr>
              </table>

              <h3>Changed Files</h3>

              {changed_files_html}

              <br>

              <p>
                  This email was automatically generated by
                  <b>GitHub Actions</b>.
              </p>

          </body>
          </html>
          """

          # Create email
          message = MIMEMultipart("alternative")
          message["Subject"] = subject
          message["From"] = os.environ["MAIL_USERNAME"]
          message["To"] = os.environ["MAIL_TO"]

          message.attach(MIMEText(email_body, "html"))

          # Send email through Gmail SMTP
          with smtplib.SMTP_SSL("smtp.gmail.com", 465) as server:
              server.login(
                  os.environ["MAIL_USERNAME"],
                  os.environ["MAIL_PASSWORD"]
              )

              server.sendmail(
                  os.environ["MAIL_USERNAME"],
                  os.environ["MAIL_TO"],
                  message.as_string()
              )

          print("Email sent successfully!")
          PY
